name: CI

on:
  push:
  workflow_dispatch:

# 👇 ГЛАВНОЕ: даём права на запись в репозиторий
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run parser
        run: python parser.py   # файл теперь в корне, путь верный

      - name: List files for debug
        run: ls -la

      - name: Commit and Push if file exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update configs $(date -u '+%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
