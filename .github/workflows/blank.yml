name: Update Proxy List

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'   # каждый час
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # важно для нормального коммита

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Parser Script
        run: python .github/workflows/parser.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Обновление прокси: $(date +'%Y-%m-%d %H:%M')"
          file_pattern: |
            YaltaVPN - Subscription
            log.csv
          commit_user_name: YaltaVPN
          commit_user_email: yalta-vpn@users.noreply.github.com
