name: Update Proxy List

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Debug - Files before
        run: ls -la

      - name: Run Parser Script
        run: python .github/workflows/parser.py || echo "Parser crashed with error code $?"

      - name: Debug - Files after
        run: ls -la

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Автообновление YaltaVPN | $(date +'%Y-%m-%d %H:%M')"
          file_pattern: |
            YaltaVPN - Subscription
            log.csv
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
